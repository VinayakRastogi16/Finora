<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 627 161">
  <defs>
    <style>
      .primary {
        fill: #387ED1;
      }
      .text {
        fill: #387ED1;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        font-size: 84px;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Icon -->
  <g transform="translate(8,10)">
    <!-- Background -->
    <rect x="0" y="0" width="70" height="70" rx="14" class="primary"/>

    <!-- Cutouts -->
    <polygon fill="#fff"
      points="18,18 52,18 52,28 28,28 28,36 46,36 46,46 28,46 28,58 18,58"/>
    <polygon fill="#fff"
      points="44,18 58,18 42,34"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="68" class="text" dominant-baseline="middle">
    FINORA
  </text>
</svg>